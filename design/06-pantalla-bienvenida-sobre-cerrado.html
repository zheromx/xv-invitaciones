</div>

<div class="relative z-20 text-center my-1">

<p class="font-body-sm text-body-sm text-on-surface-variant text-center max-w-[250px] mt-2 mb-4 leading-relaxed z-20">

      </p>

<div class="relative z-20 mb-6 bg-surface-container-low/70 px-4 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
<span class="material-symbols-outlined text-tertiary text-sm">calendar_today</span>

<div class="relative my-2 z-20 group cursor-pointer" id="sealButton">

            </span>

<span class="font-label-md text-label-md font-semibold tracking-wide">Abrir invitación</span>

</button>

<div class="mt-5 mb-2 z-20 flex items-center gap-1.5 opacity-75">

<p class="font-body-sm text-body-sm text-secondary tracking-wide">
          Pase digital exclusivo · Toca para abrir
        </p>
</div>
</div>
<!-- Bottom Envelope Faint Seam Lines -->
<div class="w-full h-4 relative z-10 flex justify-center items-center pointer-events-none">
<div class="w-24 h-[1px] bg-gradient-to-r from-transparent via-tertiary-fixed-dim/40 to-transparent"></div>
</div>
</div>
<!-- Micro-interaction script -->
<script>
    (function() {
      const openBtn = document.getElementById('openInvitationBtn');
      const sealBtn = document.getElementById('sealButton');
      const container = document.getElementById('envelopeContainer');

      function triggerOpenAnimation() {
        if (!container) return;
        // Tactile press & gentle reveal expansion
        container.style.transform = 'scale(0.97)';
        setTimeout(() => {
          container.style.transform = 'scale(1.02) translateY(-4px)';
          container.style.opacity = '0.9';
        }, 120);

        setTimeout(() => {
          container.style.transform = 'scale(1) translateY(0)';
          container.style.opacity = '1';
        }, 320);
      }

      if (openBtn) {
        openBtn.addEventListener('click', triggerOpenAnimation);
      }
      if (sealBtn) {
        sealBtn.addEventListener('click', triggerOpenAnimation);
      }
    })();
  </script>
